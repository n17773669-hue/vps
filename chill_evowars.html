<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chill Live × Evowars</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050b1a;overflow:hidden;font-family:"Baloo 2","Segoe UI",Roboto,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:linear-gradient(180deg,#0a1a52 0%,#2457c9 48%,#7cc4ff 82%,#bfe8ff 100%)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.15;transform:scale(.6)}}
  #moon{position:absolute;right:90px;top:50px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d9efff 60%,#a8d4ff);box-shadow:0 0 60px 20px rgba(180,225,255,.45)}
  .cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(22px);animation:drift 40s linear infinite}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1600px)}}
  .fb{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85) 0 12%,rgba(255,255,255,.12) 40%,rgba(160,220,255,.18));animation:rise linear infinite}
  @keyframes rise{to{transform:translate(40px,-820px)}}
  .wave{position:absolute;left:-10%;width:130%;bottom:-20px;height:120px;border-radius:45%;animation:sway 9s ease-in-out infinite alternate}
  .w1{background:rgba(40,100,220,.45)}.w2{background:rgba(20,70,190,.55);bottom:-50px;animation-duration:12s;animation-direction:alternate-reverse}
  @keyframes sway{to{transform:translateX(-6%) translateY(8px)}}

  /* chat bong bóng */
  #chat{position:absolute;left:34px;bottom:34px;width:540px;display:flex;flex-direction:column;align-items:flex-start}
  .slot{display:grid;grid-template-rows:0fr;opacity:0;margin-top:-6px;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
  .slot.in{grid-template-rows:1fr;opacity:1}.slot.out{opacity:0;transition:opacity .7s}
  .slot>div{overflow:hidden;min-height:0;padding:30px 28px 20px 24px}
  .bubble{position:relative;isolation:isolate;display:inline-block;max-width:330px;padding:8px 20px 10px;border-radius:30px;color:#fff;
    background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.55) 0 10%,transparent 30%),linear-gradient(155deg,rgba(130,210,255,.93),rgba(70,130,255,.9));
    border:2px solid rgba(255,255,255,.75);
    box-shadow:0 12px 28px rgba(30,90,255,.45),inset 0 -10px 20px rgba(255,255,255,.28),inset 8px 0 16px rgba(255,160,255,.25),inset -8px 0 16px rgba(120,255,230,.22);
    transform:translateX(-90px) scale(.7);transform-origin:left bottom;transition:transform .7s cubic-bezier(.2,.9,.3,1.3);animation:sw var(--d,5s) ease-in-out infinite}
  .slot.in .bubble{transform:none}
  @keyframes sw{0%,100%{translate:-10px 0}50%{translate:14px -5px}}
  .bubble::before{content:"";position:absolute;left:15px;top:5px;width:22px;height:8px;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-18deg)}
  .nm{font-size:12px;font-weight:700;color:#e4f6ff;margin-top:3px}.tx{font-size:17px;line-height:1.2;font-weight:500;word-break:break-word;text-shadow:0 1px 3px rgba(0,40,140,.35)}
  .ear{position:absolute;z-index:-1;background:linear-gradient(#8fd6ff,#5a9bff)}
  .ear::after{content:"";position:absolute;background:#ffb8dc}
  .cat .ear{width:22px;height:20px;top:-14px;clip-path:polygon(0 100%,50% 0,100% 100%)}
  .cat .ear::after{left:22%;right:22%;top:38%;bottom:0;clip-path:polygon(0 100%,50% 0,100% 100%)}
  .cat .e1{left:18px;transform:rotate(-14deg)}.cat .e2{right:18px;transform:rotate(14deg)}
  .bun .ear{width:15px;height:30px;top:-24px;border-radius:50% 50% 35% 35%}
  .bun .ear::after{left:28%;right:28%;top:14%;bottom:18%;border-radius:50%}
  .bun .e1{left:26px;transform:rotate(-12deg)}.bun .e2{right:26px;transform:rotate(12deg)}
  .bear .ear{width:19px;height:19px;top:-9px;border-radius:50%}.bear .ear::after{left:26%;right:26%;top:26%;bottom:26%;border-radius:50%}.bear .e1{left:14px}.bear .e2{right:14px}
  .pup .ear{width:17px;height:28px;top:-2px;border-radius:40% 40% 60% 60%;background:linear-gradient(#6aa6ff,#4a82f0)}.pup .ear::after{display:none}.pup .e1{left:-7px;transform:rotate(18deg)}.pup .e2{right:-7px;transform:rotate(-18deg)}
  .ft{position:absolute;z-index:-1;bottom:-8px;width:20px;height:15px;border-radius:50%;background:linear-gradient(#bfe6ff,#7fb8ff)}.ft::after{content:"";position:absolute;left:6px;bottom:3px;width:8px;height:6px;border-radius:50%;background:#ffb8dc}.f1{left:26px}.f2{right:26px}
  .tl{position:absolute;z-index:-1;right:-9px;bottom:8px;width:17px;height:17px;border-radius:50%;background:#e8f6ff;box-shadow:0 0 8px rgba(255,255,255,.7)}

  /* Evowars */
  #title{position:absolute;z-index:10;left:34px;top:22px;color:#fff;font-weight:700;font-size:20px;padding:6px 18px;border-radius:30px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5)}
  #hud{position:absolute;left:640px;top:22px;width:600px;color:#fff;text-shadow:0 1px 4px rgba(0,30,120,.5)}
  #hud h2{margin:0;font-size:30px;letter-spacing:1px}#hud p{margin:0;font-size:16px;opacity:.95}
  #lb{position:absolute;left:640px;top:96px;width:210px;padding:10px 14px;border-radius:22px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:16px;backdrop-filter:blur(4px)}
  #lb div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}#lb b{overflow:hidden;text-overflow:ellipsis;max-width:105px}
  #toast{position:absolute;right:34px;top:100px;width:330px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .t{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.88);color:#16409e;font-weight:700;font-size:16px;animation:pop .4s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes pop{from{transform:scale(.5);opacity:0}}
  .pl{position:absolute;transform:translate(-50%,-50%);transition:left 1.6s ease-in-out,top 1.6s ease-in-out;text-align:center;z-index:2}
  .pl.fast{transition-duration:.6s}
  .em{line-height:1;animation:hop 1.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,30,120,.35))}
  @keyframes hop{50%{transform:translateY(-10px) scale(1.06,.96)}}
  .em.evo{animation:evo 1s ease-out}
  @keyframes evo{0%{transform:scale(.3) rotate(-30deg);filter:brightness(4)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
  .tag{font-size:14px;font-weight:700;color:#fff;background:rgba(20,70,190,.65);padding:1px 10px;border-radius:12px;white-space:nowrap;margin-bottom:2px}
  .fl{position:absolute;transform:translate(-50%,-50%);font-weight:700;color:#fff;font-size:20px;text-shadow:0 2px 4px rgba(0,30,120,.6);animation:fly 1.2s ease-out forwards;z-index:5}
  @keyframes fly{to{transform:translate(-50%,-90px);opacity:0}}
  .sp{position:absolute;transform:translate(-50%,-50%);font-size:50px;z-index:6;animation:boom .6s ease-out forwards}
  @keyframes boom{from{transform:translate(-50%,-50%) scale(.2)}60%{transform:translate(-50%,-50%) scale(1.4)}to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
  #mb{position:absolute;right:20px;bottom:16px;z-index:9;border:0;border-radius:20px;padding:6px 16px;font:700 15px "Baloo 2",sans-serif;background:#fff;color:#16409e;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="moon"></div>
  <div id="title">☁ chill live ✦ lofi</div>
  <div id="hud"><h2>🐾 EVOWARS</h2><p>Mỗi tin nhắn trong chat = +1 XP · chat càng nhiều tiến hóa càng nhanh</p></div>
  <div id="lb"></div><div id="toast"></div>
  <div id="arena"></div>
  <div id="chat"></div>
  <button id="mb">🎵 Bật nhạc</button>
</div></div>

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),R=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fit(){stage.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}addEventListener('resize',fit);fit();

// nền: sao, mây, bong bóng nổi
for(let i=0;i<55;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${R(0,1280)}px;top:${R(0,300)}px;animation-delay:${R(0,3)}s;transform:scale(${R(.6,1.4)})`;stage.prepend(s)}
for(let i=0;i<4;i++){const c=document.createElement('i');c.className='cloud';c.style.cssText=`width:${R(260,420)}px;height:${R(60,100)}px;top:${R(60,330)}px;animation-delay:${-R(0,40)}s;animation-duration:${R(35,55)}s`;stage.insertBefore(c,$('#moon'))}
for(let i=0;i<22;i++){const b=document.createElement('i');b.className='fb';const z=R(14,60);b.style.cssText=`width:${z}px;height:${z}px;left:${R(0,1280)}px;animation-duration:${R(12,26)}s;animation-delay:${-R(0,20)}s;opacity:${R(.5,.9)}`;stage.insertBefore(b,$('#title'))}
['wave w1','wave w2'].forEach(c=>{const w=document.createElement('i');w.className=c;stage.insertBefore(w,$('#title'))});

// chat bong bóng tai mèo / thỏ
const chat=$('#chat'),MAX=6,LIFE=22000;
function addMessage(author,text){
  const h=[...author].reduce((a,c)=>a+c.charCodeAt(0),0),k=['cat','bun','bear','pup'][h%4],ic={cat:'🐱',bun:'🐰',bear:'🐻',pup:'🐶'}[k];
  const slot=document.createElement('div');slot.className='slot';
  slot.innerHTML=`<div><div class="bubble ${k}" style="--d:${4+h%4}s;animation-delay:-${h%5}s"><i class="ear e1"></i><i class="ear e2"></i><i class="ft f1"></i><i class="ft f2"></i><i class="tl"></i><div class="nm">${ic} ${esc(author.slice(0,22))}</div><div class="tx">${esc(text.slice(0,90))}</div></div></div>`;
  chat.append(slot);requestAnimationFrame(()=>requestAnimationFrame(()=>slot.classList.add('in')));
  setTimeout(()=>drop(slot),LIFE);while(chat.children.length>MAX)drop(chat.firstElementChild);
  play(author,text);
}
function drop(s){if(!s||s.dataset.g)return;s.dataset.g=1;s.classList.add('out');setTimeout(()=>s.remove(),750)}
window.addMessage=addMessage;

// Evowars
const arena=$('#arena'),ST=[['🥚',0],['🐛',3],['🐸',8],['🐱',15],['🐺',26],['🐯',40],['🦁',60],['🐲',90]],P={},A={x0:700,x1:1200,y0:290,y1:620};
const stOf=xp=>ST.reduce((r,s,i)=>xp>=s[1]?i:r,0);
function toast(m){const t=document.createElement('div');t.className='t';t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),4500);while($('#toast').children.length>3)$('#toast').firstElementChild.remove()}
function at(cls,txt,x,y){const e=document.createElement('div');e.className=cls;e.textContent=txt;e.style.cssText=`left:${x}px;top:${y}px`;arena.append(e);setTimeout(()=>e.remove(),1300)}
function draw(p){const s=stOf(p.xp),em=p.el.querySelector('.em');
  p.el.querySelector('.tag').textContent=p.name.slice(0,14)+' · Lv'+(s+1);
  if(s!==p.s){em.textContent=ST[s][0];em.style.fontSize=(34+s*9)+'px';
    if(p.s>=0&&s>p.s){em.classList.remove('evo');void em.offsetWidth;em.classList.add('evo');toast(`✨ ${p.name} tiến hóa ${ST[s][0]}!`)}p.s=s}}
function put(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'}
function get(n){if(!P[n]){if(Object.keys(P).length>=14){const w=Object.values(P).sort((a,b)=>a.xp-b.xp)[0];w.el.remove();delete P[w.name]}
  const el=document.createElement('div');el.className='pl';el.innerHTML='<div class="tag"></div><div class="em"></div>';arena.append(el);
  P[n]={name:n,xp:XPS[n]||0,el,x:R(A.x0,A.x1),y:R(A.y0,A.y1),s:-1,busy:false,last:0};put(P[n]);draw(P[n])}return P[n]}
function feed(p,n){p.xp+=n;draw(p);at('fl','+'+n+' XP',p.x,p.y-50)}
function fight(p){const o=Object.values(P).filter(q=>q!==p&&!q.busy);if(p.busy)return;
  if(!o.length)return;
  const t=o[Math.floor(Math.random()*o.length)];p.busy=t.busy=true;p.el.classList.add('fast');
  p.x=t.x-60;p.y=t.y;put(p);
  setTimeout(()=>{at('sp','💥',t.x-30,t.y);
    const a=stOf(p.xp)*3+R(0,5)+p.xp*.05,b=stOf(t.xp)*3+R(0,5)+t.xp*.05,w=a>=b?p:t,l=w===p?t:p;
    toast(`⚔️ ${w.name} thắng ${l.name}!`);
    setTimeout(()=>{p.x=R(A.x0,A.x1);p.y=R(A.y0,A.y1);put(p);p.el.classList.remove('fast');p.busy=t.busy=false},700)},650)}
function play(n,txt){const p=get(n),c=txt.trim().toLowerCase();
  feed(p,1);
  XPS[n]=p.xp;save()}
const KEY=new URLSearchParams(location.search).get('ws')?'evowars_live':'evowars_demo',XPS=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(XPS))}catch(e){}}
setInterval(()=>{Object.values(P).forEach(p=>XPS[p.name]=p.xp);save()},3000);
setInterval(()=>{const a=Object.values(P).filter(q=>!q.busy);if(a.length>1)fight(a[Math.floor(Math.random()*a.length)])},7000);
setInterval(()=>Object.values(P).forEach(p=>{if(!p.busy){p.x=Math.min(A.x1,Math.max(A.x0,p.x+R(-120,120)));p.y=Math.min(A.y1,Math.max(A.y0,p.y+R(-70,70)));put(p)}}),2400);
setInterval(()=>{const m=['🥇','🥈','🥉','4.','5.'];$('#lb').innerHTML='<b>🏆 Top chat</b>'+Object.entries(XPS).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,x],i)=>`<div><span>${m[i]} ${ST[stOf(x)][0]}</span><b>${esc(n)}</b><span>${x}</span></div>`).join('')},1000);

// nhạc lofi tạo bằng WebAudio (không cần file)
let ac;function music(){if(ac){ac.resume();return}ac=new AudioContext();const m=ac.createGain(),lp=ac.createBiquadFilter();m.gain.value=.16;lp.type='lowpass';lp.frequency.value=1500;m.connect(lp);lp.connect(ac.destination);
  const C=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]],pent=[523,587,659,784,880,1046];let k=0;
  const note=(f,t,d,type,v)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(1.2,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.1)};
  const bar=()=>{const t=ac.currentTime+.05;C[k++%4].forEach(f=>note(f,t,4.2,'triangle',.22));note(C[(k-1)%4][0]/2,t,4,'sine',.35);
    for(let i=0;i<8;i++)if(Math.random()<.55)note(pent[Math.floor(Math.random()*6)],t+i*.5,1.2,'sine',.14)};
  bar();setInterval(bar,4000)}
$('#mb').onclick=()=>{music();$('#mb').remove()};
try{music();setTimeout(()=>{if(ac&&ac.state==='running')$('#mb')&&$('#mb').remove()},600)}catch(e){}

// ===== Demo: khán giả giả (xóa khi nối chat thật) =====
const N=['Minh Anh','Bảo Trân','Hoàng Nam','Thu Hà','Gia Huy','Ngọc Lan','Tuấn Kiệt','Mèo Con','Bé Thỏ'],L=['Chào mọi người ơi!','Nhạc chill ghê','!eat','!fight','Evowars vui quá','!fight','Hello từ Cần Thơ nè','!eat','Cho tui lên rồng với','Bong bóng xinh quá 💙'];
const pk=a=>a[Math.floor(Math.random()*a.length)],WS=new URLSearchParams(location.search).get('ws');
// Chat thật: mở trang với ?ws=ws://localhost:8765 (server gửi JSON {"author":"..","text":".."})
if(WS){(function conn(){const s=new WebSocket(WS);s.onmessage=e=>{try{const m=JSON.parse(e.data);addMessage(String(m.author),String(m.text))}catch(_){}};s.onclose=()=>setTimeout(conn,3000)})()}
else addMessage('Minh Anh','Chào mọi người ơi!');
if(!WS)(function loop(){addMessage(pk(N),pk(L));setTimeout(loop,R(900,2200))})();
</script>
</body>
</html>
